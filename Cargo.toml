[package]
name = "cam-libre-visor"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Visor STL 3D con importación en streaming y vista completa con memoria limitada"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
glam = "0.30"
bytemuck = "1.23"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1

